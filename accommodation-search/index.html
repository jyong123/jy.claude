<title>쉼표 숙소찾기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<style>
/* 레이아웃: 모바일 한 열 앱. 상단 검색 패널 → 필터 칩 → 결과 카드 목록 → 하단 상세 시트 */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F8F7; --fg:#14211E; --muted:#5E6E6A; --line:#D8E0DE;
  --accent:#0E6B5C; --accent-soft:#D6EDE8; --accent-fg:#FFFFFF; --warm:#D9822B; --heart:#D94467;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --font-display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#17211E; --surface-2:#1E2A27; --fg:#E6EEEC; --muted:#93A5A0; --line:#2B3936;
  --accent:#4CC2A8; --accent-soft:#1D3A34; --accent-fg:#0B1A16; --warm:#F0A55A; --heart:#F07A95; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17211E; --surface-2:#1E2A27; --fg:#E6EEEC; --muted:#93A5A0; --line:#2B3936;
  --accent:#4CC2A8; --accent-soft:#1D3A34; --accent-fg:#0B1A16; --warm:#F0A55A; --heart:#F07A95; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px}
.logo b{color:var(--accent)}
.logo small{font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.iconbtn[aria-pressed="true"]{background:var(--heart);border-color:var(--heart);color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
input[type=text],input[type=date],select{width:100%;font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapchips{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;padding:7px 13px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:4px}
.stepper button{width:36px;height:36px;border-radius:8px;border:0;background:var(--surface);color:var(--fg);font-size:20px;cursor:pointer;line-height:1}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{font-weight:700;font-variant-numeric:tabular-nums}
.nights{font-size:12.5px;color:var(--muted)}
.notice{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.notice strong{color:var(--fg)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{font-weight:700}
.count span{color:var(--accent)}
.toolbar select{width:auto;min-height:38px;padding:6px 10px;font-size:13.5px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:116px 1fr;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;width:100%}
.thumb{position:relative;min-height:128px;display:flex;align-items:flex-end;padding:8px}
.thumb .t{font-family:var(--font-display);font-weight:700;font-size:12px;color:#fff;background:rgba(0,0,0,.28);border-radius:6px;padding:2px 7px}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.body{padding:11px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-weight:700;font-size:15.5px;line-height:1.3;text-wrap:balance}
.fav{border:0;background:none;padding:2px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;flex:none}
.fav[aria-pressed="true"]{color:var(--heart)}
.meta{font-size:12.5px;color:var(--muted)}
.rating{font-size:12.5px;font-weight:700;color:var(--warm)}
.rating span{color:var(--muted);font-weight:400}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:1px 6px;font-weight:500}
.price{margin-top:auto;display:flex;align-items:baseline;justify-content:flex-end;gap:6px;font-variant-numeric:tabular-nums}
.price b{font-size:17px;font-family:var(--font-display)}
.price small{font-size:11.5px;color:var(--muted)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.outlinks{display:flex;flex-direction:column;gap:8px}
.outlinks h3{margin:0;font-size:13px;color:var(--muted)}
.linkrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ext{display:flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:500;font-size:13.5px;min-height:44px}
.ext.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
/* 상세 시트 */
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;align-self:center}
.hero{height:150px;border-radius:14px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .t{position:relative;font-family:var(--font-display);font-weight:700;color:#fff;background:rgba(0,0,0,.3);border-radius:8px;padding:3px 9px}
.sheet h2{margin:0;font-family:var(--font-display);font-size:21px;line-height:1.3}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.fact small{display:block;font-size:11.5px;color:var(--muted)}
.fact b{font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.total b{font-size:20px;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.close{position:absolute;right:10px;top:10px}
.desc{margin:0;color:var(--fg)}
.searchbtn{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.searchbtn:disabled{opacity:.6;cursor:progress}
.status{font-size:13px;border-radius:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.status.live{border-color:var(--accent);color:var(--fg)}
.status.live b{color:var(--accent)}
.status.warn{border-style:dashed}
.status button{margin-top:6px}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--accent-soft);color:var(--accent)}
.badge.sample{background:var(--surface-2);color:var(--muted)}
.skel{height:128px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite linear;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.more{display:block;text-align:center}
</style>

<div class="wrap">
  <header>
    <div class="logo"><b>쉼표</b>숙소찾기 <small>지역·인원·종류로 한 번에</small></div>
    <button class="iconbtn" id="favOnly" aria-pressed="false" type="button">♥ 찜 <span id="favCount">0</span></button>
  </header>

  <form class="panel" id="searchForm" autocomplete="off">
    <div class="field">
      <label class="label" for="q">지역 · 숙소명</label>
      <input type="text" id="q" placeholder="예: 강릉, 해운대, 제주 애월" enterkeyhint="search">
      <div class="chips" id="regionChips" role="group" aria-label="지역 선택"></div>
    </div>
    <div class="row2">
      <div class="field"><label class="label" for="checkin">체크인</label><input type="date" id="checkin"></div>
      <div class="field"><label class="label" for="checkout">체크아웃</label><input type="date" id="checkout"></div>
    </div>
    <div class="row2">
      <div class="field">
        <span class="label">인원</span>
        <div class="stepper"><button type="button" id="minus" aria-label="인원 줄이기">−</button><output id="guests">2명</output><button type="button" id="plus" aria-label="인원 늘리기">+</button></div>
      </div>
      <div class="field">
        <label class="label" for="maxPrice">1박 최대 가격</label>
        <select id="maxPrice">
          <option value="0">상관없음</option><option value="50000">5만원 이하</option><option value="70000">7만원 이하</option><option value="100000">10만원 이하</option>
          <option value="150000">15만원 이하</option><option value="200000">20만원 이하</option><option value="300000">30만원 이하</option>
        </select>
      </div>
    </div>
    <div class="field">
      <span class="label">숙박 종류</span>
      <div class="chips wrapchips" id="typeChips" role="group" aria-label="숙박 종류"></div>
    </div>
    <div class="nights" id="nightsInfo"></div>
    <button class="searchbtn" id="go" type="submit">숙소 검색</button>
  </form>

  <div class="status" id="status" role="status"></div>

  <div class="toolbar">
    <div class="count" id="count"></div>
    <select id="sort" aria-label="정렬">
      <option value="rec">추천순</option><option value="low">낮은 가격순</option><option value="high">높은 가격순</option><option value="rate">평점순</option>
    </select>
  </div>

  <div class="list" id="list"></div>

  <section class="outlinks panel" aria-label="다른 예약 사이트">
    <h3>다른 사이트에서도 찾아보기 (지역·날짜·인원 적용)</h3>
    <div class="linkrow" id="outLinks"></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>

<script>
const TYPES=["호텔","리조트","펜션","모텔","게스트하우스","한옥","글램핑"];
const REGIONS=["서울","부산","제주","강릉","속초","여수","경주","전주","가평","인천"];
const SERVER="PlayMCP", TOOL="YeogiTravelAgent-search";
// 여기어때 연결이 안 될 때만 쓰는 예시 숙소 [이름, 지역, 동네, 종류, 1박가격, 평점(10점), 리뷰수]
const SAMPLE=[
["한강뷰 스테이 마포","서울","마포·합정","호텔",168000,9.2,1240],["북촌 소담재","서울","북촌","한옥",189000,9.6,410],["홍대 문간 게스트하우스","서울","홍대","게스트하우스",38000,8.6,2210],["강남 시티 모텔 S","서울","강남역","모텔",69000,8.4,3150],
["해운대 오션그랜드","부산","해운대","호텔",245000,9.4,2980],["기장 바다정원 펜션","부산","기장","펜션",158000,9.2,330],["서면 스테이 M","부산","서면","모텔",62000,8.2,1890],
["함덕 선셋 리조트","제주","함덕","리조트",265000,9.6,1760],["애월 돌담 독채","제주","애월","펜션",210000,9.4,620],["서귀포 숲속 글램핑","제주","서귀포","글램핑",135000,9.0,480],
["경포 오션 호텔","강릉","경포","호텔",176000,9.2,1340],["강릉 솔향 한옥","강릉","초당","한옥",155000,9.6,260],["설악 마운틴 리조트","속초","설악","리조트",198000,9.2,1580],
["여수 밤바다 호텔","여수","돌산","호텔",185000,9.4,1690],["황리단길 한옥 스테이","경주","황리단길","한옥",172000,9.6,540],["전주 한옥마을 고택","전주","한옥마을","한옥",145000,9.4,880],
["북한강 풀빌라","가평","청평","펜션",290000,9.4,560],["잣나무숲 글램핑","가평","설악면","글램핑",119000,9.0,720],["송도 센트럴 호텔","인천","송도","호텔",138000,9.0,1450]
].map((r,i)=>({id:"s"+i,name:r[0],loc:r[1]+" "+r[2],region:r[1],type:r[3],total:r[4],rating:r[5],reviews:r[6],link:"",sample:true}));

const S={q:"",region:"강릉",type:"전체",guests:2,maxPrice:0,sort:"rec",favOnly:false,favs:{},items:[],mode:"idle",baseUrl:"",totalCount:0,searched:null};
try{S.favs=JSON.parse(localStorage.getItem("shimpyo-favs2")||"{}")||{}}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("shimpyo-favs2",JSON.stringify(S.favs))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won=n=>Math.round(n).toLocaleString("ko-KR")+"원";
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=new Date();const tmr=new Date(today);tmr.setDate(tmr.getDate()+1);const after=new Date(today);after.setDate(after.getDate()+2);
$("checkin").value=iso(tmr);$("checkout").value=iso(after);$("checkin").min=iso(today);$("checkout").min=iso(after);

function nights(){const a=new Date($("checkin").value),b=new Date($("checkout").value);const n=Math.round((b-a)/864e5);return n>0?n:1}
function where(){return S.q.trim()||(S.region!=="전체"?S.region:"")}
function keyword(){const w=where()||"서울";return S.type==="전체"?w+" 숙소":w+" "+S.type}
function chipGroup(el,items,key,withAll){
  el.innerHTML="";(withAll?["전체",...items]:items).forEach(v=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=v;b.setAttribute("aria-pressed",S[key]===v&&!(key==="region"&&S.q.trim()));
  b.onclick=()=>{S[key]=v;if(key==="region"){S.q="";$("q").value=""}chipGroup(el,items,key,withAll);search()};el.appendChild(b)});
}
function parseItem(h){
  const total=+String(h.price??h.priceInfo?.displayPrice??"").replace(/[^\d]/g,"")||0;
  const m=String(h.rating??h.reviewSummary?.rating??"").match(/([\d.]+)\s*\((\d+)/);
  const nm=h.hotelName||h.name||"";
  const ty=TYPES.find(t=>nm.includes(t))||(S.type!=="전체"?S.type:"숙소");
  return {id:String(h.hotelId||h.id||nm),name:nm,loc:h.locationV2||"",type:ty,total,rating:m?+m[1]:0,reviews:m?+m[2]:0,
    link:h.priceInfo?.linkToBook||h.link||"",soldOut:(h.priceInfo?.availabilityStatus||"Available")!=="Available"};
}
const TYPE_HUE={"호텔":200,"리조트":170,"펜션":30,"모텔":280,"게스트하우스":340,"한옥":20,"글램핑":110,"숙소":190};
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function art(item){
  const h=(TYPE_HUE[item.type]??190)+hash(item.id)%24-12, gid="g"+hash(item.id+item.name);
  const roof=item.type==="한옥"?'<path d="M10 70 Q60 40 110 70 L100 72 L100 100 L20 100 L20 72Z" fill="rgba(255,255,255,.18)"/>'
   :item.type==="글램핑"?'<path d="M25 100 L60 48 L95 100Z" fill="rgba(255,255,255,.2)"/>'
   :(item.type==="호텔"||item.type==="리조트")?'<rect x="34" y="34" width="30" height="66" fill="rgba(255,255,255,.17)"/><rect x="68" y="52" width="22" height="48" fill="rgba(255,255,255,.12)"/>'
   :'<path d="M24 100 L24 66 L60 44 L96 66 L96 100Z" fill="rgba(255,255,255,.17)"/>';
  const sea=/해변|바다|오션|항|호수|강/.test(item.loc+item.name)?'<path d="M0 104 Q15 98 30 104 T60 104 T90 104 T120 104 V130 H0Z" fill="rgba(255,255,255,.22)"/>':'';
  return `<svg viewBox="0 0 120 130" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h} 55% 52%)"/><stop offset="1" stop-color="hsl(${h+30} 50% 32%)"/></linearGradient></defs><rect width="120" height="130" fill="url(#${gid})"/><circle cx="96" cy="26" r="11" fill="rgba(255,255,255,.35)"/>${roof}${sea}</svg>`;
}
function visible(){
  const n=S.searched?.nights||nights();
  let r=S.favOnly?Object.values(S.favs):S.items.slice();
  if(S.mode==="sample"&&!S.favOnly){const w=where();r=r.filter(d=>(!w||(d.name+d.loc).includes(w))&&(S.type==="전체"||d.type===S.type))}
  r=r.map(d=>d.sample?{...d,total:d.total*n}:d);
  if(S.maxPrice)r=r.filter(d=>d.total&&d.total/n<=S.maxPrice);
  const sorts={rec:()=>0,low:(a,b)=>(a.total||9e9)-(b.total||9e9),high:(a,b)=>b.total-a.total,rate:(a,b)=>b.rating-a.rating||b.reviews-a.reviews};
  return r.sort(sorts[S.sort]);
}
function extLinks(w){
  w=w||where()||"국내";const t=S.type!=="전체"?S.type:"숙소";const ci=$("checkin").value,co=$("checkout").value,g=S.guests,e=encodeURIComponent;
  return [
    ["여기어때",`https://www.yeogi.com/domestic-accommodations?keyword=${e(w+(S.type!=="전체"?" "+S.type:""))}&checkIn=${ci}&checkOut=${co}&personal=${g}`,true],
    ["네이버",`https://search.naver.com/search.naver?query=${e(w+" "+t)}`],
    ["부킹닷컴",`https://www.booking.com/searchresults.ko.html?ss=${e(w)}&checkin=${ci}&checkout=${co}&group_adults=${g}&no_rooms=1`],
    ["에어비앤비",`https://www.airbnb.co.kr/s/${e(w)}/homes?checkin=${ci}&checkout=${co}&adults=${g}`]
  ].map(([l,u,p])=>`<a class="ext${p?" primary":""}" href="${u}" target="_blank" rel="noopener">${l} ↗</a>`).join("");
}
function setStatus(html,cls){const el=$("status");el.className="status "+(cls||"");el.innerHTML=html}
function render(){
  const n=nights();$("guests").textContent=S.guests+"명";$("minus").disabled=S.guests<=1;$("plus").disabled=S.guests>=10;
  $("nightsInfo").textContent=`${n}박 · ${S.guests}명 · 검색어 “${keyword()}”`;
  $("favCount").textContent=Object.keys(S.favs).length;$("favOnly").setAttribute("aria-pressed",S.favOnly);
  $("go").disabled=S.mode==="loading";$("go").textContent=S.mode==="loading"?"검색 중…":"숙소 검색";
  $("outLinks").innerHTML=extLinks();
  if(S.mode==="loading"&&!S.favOnly){$("count").textContent="";$("list").innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';return}
  const r=visible(),sn=S.searched?.nights||n;
  const hidden=(S.favOnly?Object.keys(S.favs).length:S.mode==="sample"?null:S.items.length)-r.length;
  $("count").innerHTML=`${S.favOnly?"찜한 숙소 ":""}<span>${r.length}</span>곳`+(S.maxPrice&&hidden>0?` <small style="font-weight:400;color:var(--muted)">(가격 조건으로 ${hidden}곳 숨김)</small>`:"");
  $("list").innerHTML=r.length?r.map(d=>`
    <div class="card" role="button" tabindex="0" data-id="${esc(d.id)}">
      <div class="thumb">${art(d)}<span class="t" style="position:relative">${esc(d.type)}</span></div>
      <div class="body">
        <div class="top"><div class="name">${esc(d.name)}</div><button class="fav" type="button" data-fav="${esc(d.id)}" aria-pressed="${!!S.favs[d.id]}" aria-label="찜하기">${S.favs[d.id]?"♥":"♡"}</button></div>
        <div class="meta">${esc(d.loc)}</div>
        <div class="rating">${d.rating?`★ ${d.rating.toFixed(1)}`:""} <span>${d.reviews?`(${d.reviews.toLocaleString()})`:""}</span> ${d.sample?'<span class="badge sample">예시</span>':'<span class="badge">여기어때</span>'}</div>
        <div class="price">${d.soldOut?"<small>예약 마감</small>":d.total?`<small>1박 약 ${won(d.total/sn)}</small><b>${won(d.total)}</b><small>${sn}박</small>`:"<small>요금 정보 없음</small>"}</div>
      </div>
    </div>`).join("")
    :`<div class="empty"><b>${S.favOnly?"찜한 숙소가 없어요":"조건에 맞는 숙소가 없어요"}</b>${S.favOnly?"♡를 눌러 마음에 드는 숙소를 모아보세요.":"1박 최대 가격을 올리거나 숙박 종류를 ‘전체’로 바꿔 보세요."}</div>`;
  if(!S.favOnly&&S.mode==="live"&&S.baseUrl)$("list").insertAdjacentHTML("beforeend",`<a class="ext more" href="${esc(S.baseUrl)}" target="_blank" rel="noopener">여기어때에서 ${S.totalCount?S.totalCount+"곳 ":""}전체 보기 ↗</a>`);
}
function findItem(id){return S.items.find(x=>x.id===id)||S.favs[id]}
function openSheet(id){
  const d=findItem(id);if(!d)return;const n=S.searched?.nights||nights();const total=d.sample?d.total*n:d.total;
  $("sheet").innerHTML=`<div class="grab"></div>
    <button class="iconbtn close" type="button" id="closeSheet">닫기</button>
    <div class="hero">${art(d)}<span class="t">${esc(d.type)}${d.sample?" · 예시 숙소":""}</span></div>
    <h2 id="sheetTitle">${esc(d.name)}</h2>
    <div class="meta">${esc(d.loc)} ${d.rating?`· <span class="rating">★ ${d.rating.toFixed(1)}</span> 리뷰 ${d.reviews.toLocaleString()}개`:""}</div>
    <div class="facts"><div class="fact"><small>체크인</small><b>${$("checkin").value.slice(5).replace("-","/")}</b></div><div class="fact"><small>체크아웃</small><b>${$("checkout").value.slice(5).replace("-","/")}</b></div><div class="fact"><small>인원</small><b>${S.guests}명</b></div></div>
    ${total?`<div class="total"><span>${n}박 요금 (1박 약 ${won(total/n)})</span><b>${won(total)}</b></div>`:""}
    <p class="nights" style="margin:0">${d.sample?"예시 숙소라 실제로 예약할 수 없어요. 아래 사이트에서 같은 지역을 찾아보세요.":"여기어때에 표시된 최저가 기준이에요. 객실과 최종 요금은 예약 화면에서 확인하세요."}</p>
    <div class="outlinks"><div class="linkrow">${d.link?`<a class="ext primary" style="grid-column:1/-1" href="${esc(d.link)}" target="_blank" rel="noopener">여기어때에서 객실 보고 예약하기 ↗</a>`:extLinks(d.region)}</div></div>`;
  $("sheet").hidden=false;$("scrim").hidden=false;$("closeSheet").focus();$("closeSheet").onclick=closeSheet;
}
function closeSheet(){$("sheet").hidden=true;$("scrim").hidden=true}

let mcp=null, mcpReady=window.claude?.use?window.claude.use("mcp").then(m=>(mcp=m)).catch(()=>null):Promise.resolve(null), seq=0;
const FIX={needs_reauth:"PlayMCP 연결이 만료됐어요. claude.ai 설정 → 커넥터에서 PlayMCP를 다시 연결해 주세요.",
  server_not_connected:"PlayMCP가 연결돼 있지 않아요. claude.ai 설정 → 커넥터에서 PlayMCP를 추가해 주세요.",
  selection_required:"PlayMCP 연결이 여러 개예요. 화면에 뜨는 안내에서 하나를 골라 주세요.",
  not_in_manifest:"이 페이지에서 PlayMCP 사용이 허용되지 않았어요. 페이지의 권한 메뉴에서 허용해 주세요.",
  approval_required:"PlayMCP 사용 허락이 필요해요. 아래 버튼을 눌러 허용해 주세요.",
  blocked_by_policy:"조직 정책으로 이 도구를 쓸 수 없어요.",
  server_unavailable:"여기어때 서버가 잠시 응답하지 않아요. 잠시 후 다시 검색해 주세요.",
  tool_error:"여기어때 검색이 실패했어요. 검색어를 바꿔 다시 시도해 주세요."};
function useSample(reason){
  S.mode="sample";S.items=SAMPLE;S.baseUrl="";
  setStatus(`<b>예시 데이터로 보여주는 중</b><br>${esc(reason)} 지금 목록은 실제 숙소가 아니에요.${reason.includes("버튼")?'<br><button class="iconbtn" type="button" id="retry">허용하고 다시 검색</button>':""}`,"warn");
  render();const rb=$("retry");if(rb)rb.onclick=()=>search();
}
async function search(){
  const my=++seq;S.favOnly=false;
  const params={keyword:keyword(),checkIn:$("checkin").value,checkOut:$("checkout").value,personal:S.guests,simplified_response:true};
  S.mode="loading";setStatus(`여기어때에서 “${esc(params.keyword)}” 찾는 중…`);render();
  await mcpReady;
  if(my!==seq)return;
  if(!mcp){useSample("이 화면에서는 여기어때 연결을 쓸 수 없어요 (claude.ai에 로그인해서 열면 실제 숙소가 나와요).");return}
  try{
    const res=await mcp.callTool(SERVER,TOOL,params,{cache:{staleTime:5*60e3,gcTime:30*60e3}});
    if(my!==seq)return;
    const p=typeof res.payload==="string"?JSON.parse(res.payload):res.payload;
    const list=(p&&Array.isArray(p.hotels))?p.hotels.map(parseItem).filter(x=>x.name):[];
    S.items=list;S.mode="live";S.baseUrl=p?.baseUrl||"";S.totalCount=p?.totalCount||0;S.searched={nights:nights()};
    setStatus(`<b>여기어때 실시간 결과</b> · “${esc(params.keyword)}” ${S.searched.nights}박 ${S.guests}명 기준 요금이에요. 1박 최대 가격은 앱에서 바로 걸러져요.`,"live");
    render();
  }catch(err){
    if(my!==seq)return;
    const code=err?.code||"upstream_error";
    useSample(FIX[code]||"여기어때 결과를 가져오지 못했어요. 잠시 후 다시 검색해 주세요.");
  }
}

$("list").addEventListener("click",e=>{
  const f=e.target.closest("[data-fav]");
  if(f){e.stopPropagation();const id=f.dataset.fav;if(S.favs[id])delete S.favs[id];else{const d=findItem(id);if(d)S.favs[id]=d}saveFavs();render();return}
  const c=e.target.closest(".card");if(c)openSheet(c.dataset.id);
});
$("list").addEventListener("keydown",e=>{const c=e.target.closest(".card");if(c&&(e.key==="Enter"||e.key===" ")&&!e.target.closest("[data-fav]")){e.preventDefault();openSheet(c.dataset.id)}});
$("scrim").onclick=closeSheet;document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
$("q").addEventListener("input",e=>{S.q=e.target.value;chipGroup($("regionChips"),REGIONS,"region",false);render()});
$("searchForm").addEventListener("submit",e=>{e.preventDefault();$("q").blur();search()});
$("minus").onclick=()=>{S.guests=Math.max(1,S.guests-1);render()};
$("plus").onclick=()=>{S.guests=Math.min(10,S.guests+1);render()};
$("maxPrice").onchange=e=>{S.maxPrice=+e.target.value;render()};
$("sort").onchange=e=>{S.sort=e.target.value;render()};
$("favOnly").onclick=()=>{S.favOnly=!S.favOnly;render()};
$("checkin").onchange=()=>{const a=new Date($("checkin").value);const m=new Date(a);m.setDate(m.getDate()+1);$("checkout").min=iso(m);if(new Date($("checkout").value)<=a)$("checkout").value=iso(m);render()};
$("checkout").onchange=render;
chipGroup($("regionChips"),REGIONS,"region",false);chipGroup($("typeChips"),TYPES,"type",true);
render();search();
</script>
